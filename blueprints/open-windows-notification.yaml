blueprint:
  name: Temperature-difference-based open windows notification
  author: BWagener
  description: >
    Sends a notification when one temperature sensor rises above or falls below another.
    "Open windows" is sent when indoor temperature is above outdoor temperature;
    "Close windows" is sent when indoor temperature is below outdoor temperature.
    Notifications are sent only to selected mobile app devices currently inside the selected zone.
    Optionally, notifications are only active when the highest forecast temperature
    is at or above a configured threshold.
  domain: automation
  input:
    indoor_temperature:
      name: Indoor temperature entity
      description: Indoor temperature to compare with outdoor temperature.
      selector:
        entity:
          domain: sensor
          device_class: temperature
    outdoor_temperature:
      name: Outdoor temperature entity
      description: Outdoor temperature used as comparison baseline.
      selector:
        entity:
          domain: sensor
          device_class: temperature
    notify_devices:
      name: Notification devices
      description: >
        Select one or more mobile app devices to notify.
        Each selected device is notified only if one of its device_tracker entities is in the selected zone.
      default: []
      selector:
        device:
          filter:
            - integration: mobile_app
          multiple: true
    required_zone:
      name: Zone for presence check
      description: Notifications are sent only when the mapped presence entity is in this zone.
      default: zone.home
      selector:
        entity:
          domain: zone
    forecast_options:
      name: Forecast options
      icon: mdi:weather-partly-cloudy
      collapsed: true
      input:
        forecast_temperature_entity:
          name: Forecast max temperature entity
          description: >
            Optional temperature sensor used to gate notifications. Create a template sensor via weather.get_forecasts
            (for example tomorrow max temperature) and select it here. Example: https://community.home-assistant.io/t/max-temperature-forecast/743936/2
          default: ""
          selector:
            entity:
              domain: sensor
              device_class: temperature
        forecast_threshold:
          name: Forecast activation threshold
          description: Notifications are active only when forecast temperature meets this.
          default: 21
          selector:
            number:
              min: -30
              max: 50
              step: 0.5
              unit_of_measurement: °C
    debounce_options:
      name: Debounce options
      icon: mdi:timer-cog
      collapsed: true
      input:
        debounce_minutes:
          name: Debounce time
          description: >
            Condition must remain true for this many minutes before notifying.
            Increase this to suppress flapping around the threshold.
          default: 5
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: min
        min_notification_interval_minutes:
          name: Minimum notification interval
          description: Do not send another notification until this many minutes have passed.
          default: 30
          selector:
            number:
              min: 0
              max: 1440
              step: 1
              unit_of_measurement: min
    notification_content:
      name: Notification content
      icon: mdi:message-text
      collapsed: true
      input:
        open_message:
          name: Message when indoor temperature is above outdoor temperature
          description: Optional override for notification content when opening is advised.
          default: ""
          selector:
            text:
        close_message:
          name: Message when indoor temperature is below outdoor temperature
          description: Optional override for notification content when closing is advised.
          default: ""
          selector:
            text:
        notification_title:
          name: Notification title
          description: Optional override for notification title.
          default: ""
          selector:
            text:
        include_temperatures:
          name: Include indoor/outdoor temperatures
          description: Append current indoor and outdoor values to the notification message.
          default: true
          selector:
            boolean:

mode: single
max_exceeded: silent

trigger:
  - platform: numeric_state
    id: indoor_above_outdoor
    entity_id: !input indoor_temperature
    above: !input outdoor_temperature
    for:
      minutes: !input debounce_minutes
  - platform: numeric_state
    id: indoor_below_outdoor
    entity_id: !input indoor_temperature
    below: !input outdoor_temperature
    for:
      minutes: !input debounce_minutes

variables:
  indoor_entity: !input indoor_temperature
  outdoor_entity: !input outdoor_temperature
  notify_targets: !input notify_devices
  required_zone_entity: !input required_zone
  required_zone_object_id: "{{ required_zone_entity.split('.')[1] }}"
  msg_open: !input open_message
  msg_close: !input close_message
  msg_title: !input notification_title
  include_temps: !input include_temperatures
  min_interval_minutes: !input min_notification_interval_minutes
  forecast_temp_entity: !input forecast_temperature_entity
  forecast_threshold_c: !input forecast_threshold

action:
  - condition: template
    value_template: >
      {% set entity_id = forecast_temp_entity | trim %}
      {% if entity_id == '' %}
        true
      {% else %}
        {% set forecast_temp = states(entity_id) | float(none) %}
        {{ forecast_temp is not none and forecast_temp >= (forecast_threshold_c | float(21)) }}
      {% endif %}
  - condition: template
    value_template: >
      {{
        this.attributes.last_triggered is none
        or (as_timestamp(now()) - as_timestamp(this.attributes.last_triggered))
           >= (min_interval_minutes | int(0) * 60)
      }}
  - variables:
      indoor_area: "{{ area_name(indoor_entity) }}"
      zone_filtered_notify_devices: >
        {% set zone_short_name = required_zone_object_id | lower | trim %}
        {% set ns = namespace(devices=[]) %}
        {% for device in notify_targets %}
          {% set device_status = namespace(in_zone=false) %}
          {% set trackers = device_entities(device) | select('search', '^device_tracker\\.') | list %}
          {% for tracker in trackers %}
            {% if (states(tracker) | string).lower().strip() == zone_short_name %}
              {% set device_status.in_zone = true %}
            {% endif %}
          {% endfor %}
          {% if device_status.in_zone %}
            {% set ns.devices = ns.devices + [device] %}
          {% endif %}
        {% endfor %}
        {{ ns.devices }}
      action_word: "{{ 'open' if trigger.id == 'indoor_above_outdoor' else 'close' }}"
      default_title: >
        {{ action_word }} windows in {{ indoor_area if indoor_area else 'indoor area' }}
      notification_title: >
        {% set custom_title = msg_title | trim %}
        {{ custom_title if custom_title else default_title }}
      notification_message: >
        {% set custom_message = msg_open if trigger.id == 'indoor_above_outdoor' else msg_close %}
        {% set custom_message = custom_message | trim %}
        {% set indoor_value = states(indoor_entity) %}
        {% set outdoor_value = states(outdoor_entity) %}
        {% set indoor_unit = state_attr(indoor_entity, 'unit_of_measurement') | default('', true) %}
        {% set outdoor_unit = state_attr(outdoor_entity, 'unit_of_measurement') | default('', true) %}
        {% set has_indoor = indoor_value not in ['unknown', 'unavailable', 'none', 'None', ''] %}
        {% set has_outdoor = outdoor_value not in ['unknown', 'unavailable', 'none', 'None', ''] %}
        {% set diff_unit = indoor_unit if indoor_unit else outdoor_unit %}
        {% set detail_parts = [] %}
        {% if custom_message %}
          {% set base_message = custom_message %}
        {% elif has_indoor and has_outdoor %}
          {% set diff_value = (indoor_value | float(0)) - (outdoor_value | float(0)) %}
          {% set base_message = 'temperature difference: ' ~ (diff_value | abs | round(1)) ~ diff_unit %}
        {% else %}
          {% set base_message = 'temperature difference unavailable' %}
        {% endif %}
        {% if include_temps and has_indoor %}
          {% set indoor_label = indoor_area if indoor_area else 'indoor' %}
          {% set indoor_part = indoor_label ~ ': ' ~ indoor_value ~ indoor_unit %}
          {% if has_outdoor %}
            {% set detail_parts = detail_parts + [indoor_part ~ ', outdoor: ' ~ outdoor_value ~ outdoor_unit] %}
          {% else %}
            {% set detail_parts = detail_parts + [indoor_part] %}
          {% endif %}
        {% endif %}
        {% if detail_parts | count > 0 %}
          {{ base_message }} ({{ detail_parts | join(' | ') }})
        {% else %}
          {{ base_message }}
        {% endif %}
  - repeat:
      for_each: "{{ zone_filtered_notify_devices }}"
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            title: "{{ notification_title | trim }}"
            message: "{{ notification_message | trim }}"
          continue_on_error: true
